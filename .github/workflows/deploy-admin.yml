name: 🚀 Deploy Admin Portal → Vercel

on:
  push:
    branches:
      - main
    paths:
      - "admin-portal/**"
      - ".github/workflows/deploy-admin.yml"

jobs:
  deploy:
    name: Build & Deploy to Vercel (Production)
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: admin-portal/package-lock.json

      - name: 📦 Install dependencies
        working-directory: admin-portal
        run: npm ci

      - name: 🔨 Build (validate before deploy)
        working-directory: admin-portal
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: 🔺 Install Vercel CLI
        run: npm install --global vercel@latest

      - name: 🔗 Pull Vercel environment info
        working-directory: admin-portal
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: 🏗️ Build with Vercel
        working-directory: admin-portal
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: 🚀 Deploy to Vercel Production
        working-directory: admin-portal
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
