name: 🚀 Deploy Member App → EAS (OTA Update)

on:
  push:
    branches:
      - main
    paths:
      - "member-app/**"
      - ".github/workflows/deploy-member-app.yml"

jobs:
  ota-update:
    name: Publish OTA Update via EAS
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: member-app/package-lock.json

      - name: 📦 Install dependencies
        working-directory: member-app
        run: npm ci

      - name: 🔧 Setup EAS CLI
        run: npm install --global eas-cli

      - name: 🔺 Publish OTA update to production channel
        working-directory: member-app
        run: eas update --branch production --message "Deploy from commit ${{ github.sha }}" --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
